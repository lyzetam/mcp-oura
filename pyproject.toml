[project]
name = "mcp-oura"
version = "0.3.5"
description = "Read-only MCP server that gives Claude live access to your Oura Ring data through the Oura API v2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Landry Zetam" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "oura", "oura-ring", "claude", "sleep", "health"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "filelock>=3.20.3",  # 3.20.1 and 3.20.3 fix lock-file symlink races (CVE-2025-68146, CVE-2026-22701)
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "tzlocal>=5.3",
]

[project.urls]
Homepage = "https://github.com/lyzetam/mcp-oura"
Issues = "https://github.com/lyzetam/mcp-oura/issues"
Changelog = "https://github.com/lyzetam/mcp-oura/blob/main/CHANGELOG.md"

[project.scripts]
mcp-oura = "mcp_oura.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_oura"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_oura", "fake_oura"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["mcp_oura"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
